<script>
var duckIdle;
document.addEventListener('mousemove', function (e) {
    var eye = document.getElementById('duck-eye');
    var pupil = document.getElementById('duck-pupil');
    var r = eye.getBoundingClientRect();
    var angle = Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
    var x = Math.cos(angle) * r.width * 0.3;
    var y = Math.sin(angle) * r.height * 0.3;
    pupil.style.transform = 'translate(calc(-50% + ' + x + 'px), calc(-50% + ' + y + 'px))';
    clearTimeout(duckIdle);
    duckIdle = setTimeout(function () {
        pupil.style.transform = 'translate(-50%, -50%)';
    }, 2000);
});
document.addEventListener('click', function (e) {
    if (!e.target.closest('#theme-toggle')) return;
    var eye = document.getElementById('duck-eye');
    var pupil = document.getElementById('duck-pupil');
    eye.style.background = 'linear-gradient(#ff9d00 45%, #000 45%, #000 55%, #ff9d00 55%)';
    pupil.style.visibility = 'hidden';
    setTimeout(function () {
        eye.style.background = '#fff';
        pupil.style.visibility = 'visible';
    }, 150);
});
</script>
